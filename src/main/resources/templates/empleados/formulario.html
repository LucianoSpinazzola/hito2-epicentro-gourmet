<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epicentro Gourmet - Alta de Empleado</title>
    <style>
        :root {
            --bg-principal: #f4f6f9;
            --bg-tarjeta: #ffffff;
            --texto-principal: #333333;
            --texto-secundario: #666666;
            --borde: #cccccc;
            --primario: #007bff;
            --primario-hover: #0056b3;
            --danger: #dc3545;
            --exito: #28a745;
        }

        [data-theme="dark"] {
            --bg-principal: #121212;
            --bg-tarjeta: #1e1e1e;
            --texto-principal: #e0e0e0;
            --texto-secundario: #a0a0a0;
            --borde: #444444;
            --primario: #3792ff;
            --primario-hover: #1e70d6;
            --danger: #ff6b7b;
            --exito: #2ea44f;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .form-container {
            background-color: var(--bg-tarjeta);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 650px;
        }

        .header-form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primario);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--borde);
            border-radius: 4px;
            background-color: var(--bg-tarjeta);
            color: var(--texto-principal);
            font-size: 15px;
            box-sizing: border-box;
        }

        .fecha-grupo {
            display: flex;
            gap: 10px;
        }

        .fecha-grupo select {
            flex: 1;
        }

        .ayuda {
            font-size: 13px;
            color: var(--texto-secundario);
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primario);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: var(--primario-hover);
        }

        .btn-volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--texto-principal);
            text-decoration: none;
            font-size: 14px;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-danger { background-color: #f8d7da; color: #721c24; }
        .alert-success { background-color: #d4edda; color: #155724; }

        [data-theme="dark"] .alert-danger { background-color: #2c0b0e; color: #f8b4b9; }
        [data-theme="dark"] .alert-success { background-color: #0f2d19; color: #b4f8c6; }

        .error-campo {
            border: 2px solid var(--danger) !important;
        }

        .btn-submit:focus-visible,
        .btn-volver:focus-visible,
        #theme-toggle:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--primario);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- main: región principal. NVDA la anuncia como "región principal". -->
    <main class="form-container" role="main" aria-labelledby="titulo-alta">

        <header class="header-form">
            <h1 id="titulo-alta">Alta de Empleado</h1>
            <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 18px;"
                    aria-label="Cambiar entre modo claro y modo oscuro">
                <span aria-hidden="true">🌓</span> Modo
            </button>
        </header>

        <!-- Mensajes con role="alert": NVDA los anuncia al aparecer. -->
        <div th:if="${mensajeError}" id="mensaje-error" class="alert alert-danger" role="alert" th:text="${mensajeError}"></div>
        <div th:if="${mensajeExito}" class="alert alert-success" role="alert" th:text="${mensajeExito}"></div>

        <form th:action="@{/empleados/nuevo}" th:object="${empleadoForm}" method="post"
              aria-label="Formulario de alta de empleado">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required aria-required="true"
                       th:classappend="${campoError == 'nombre'} ? 'error-campo'"
                       th:attr="aria-invalid=${campoError == 'nombre' ? 'true' : 'false'}" />
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}" required aria-required="true"
                       th:classappend="${campoError == 'apellido'} ? 'error-campo'"
                       th:attr="aria-invalid=${campoError == 'apellido' ? 'true' : 'false'}" />
            </div>

            <div class="form-group">
                <label for="dni">DNI</label>
                <input type="number" id="dni" th:field="*{dni}" required aria-required="true" min="1000000"
                       th:classappend="${campoError == 'dni'} ? 'error-campo'"
                       th:attr="aria-invalid=${campoError == 'dni' ? 'true' : 'false'}" />
            </div>

            <!-- Fecha de nacimiento en tres cuadros combinados dentro de un fieldset con legend.
                 NVDA anuncia "Fecha de nacimiento, grupo" y cada select como "cuadro combinado".
                 Si hubo error, el fieldset se asocia al mensaje con aria-describedby. -->
            <fieldset class="form-group" style="border: none; padding: 0; margin: 0 0 18px 0;"
                      th:attr="aria-describedby=${campoError == 'fechaNacimiento' ? 'mensaje-error' : null}">
                <legend style="font-weight: bold; margin-bottom: 5px;">Fecha de nacimiento</legend>
                <div class="fecha-grupo">
                    <div>
                        <label for="diaNacimiento">Día</label>
                        <select id="diaNacimiento" th:field="*{diaNacimiento}" required aria-required="true"
                                th:classappend="${campoError == 'fechaNacimiento'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaNacimiento' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option th:each="d : ${#numbers.sequence(1, 31)}" th:value="${d}" th:text="${d}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="mesNacimiento">Mes</label>
                        <select id="mesNacimiento" th:field="*{mesNacimiento}" required aria-required="true"
                                th:classappend="${campoError == 'fechaNacimiento'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaNacimiento' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option value="1">Enero</option>
                            <option value="2">Febrero</option>
                            <option value="3">Marzo</option>
                            <option value="4">Abril</option>
                            <option value="5">Mayo</option>
                            <option value="6">Junio</option>
                            <option value="7">Julio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Septiembre</option>
                            <option value="10">Octubre</option>
                            <option value="11">Noviembre</option>
                            <option value="12">Diciembre</option>
                        </select>
                    </div>
                    <div>
                        <label for="anioNacimiento">Año</label>
                        <select id="anioNacimiento" th:field="*{anioNacimiento}" required aria-required="true"
                                th:classappend="${campoError == 'fechaNacimiento'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaNacimiento' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option th:each="a : ${#numbers.sequence(1900, 2099)}" th:value="${a}" th:text="${a}"></option>
                        </select>
                    </div>
                </div>
                <p class="ayuda" id="ayuda-nacimiento">El empleado debe ser mayor de edad.</p>
            </fieldset>

            <fieldset class="form-group" style="border: none; padding: 0; margin: 0 0 18px 0;"
                      th:attr="aria-describedby=${campoError == 'fechaIngreso' ? 'mensaje-error' : null}">
                <legend style="font-weight: bold; margin-bottom: 5px;">Fecha de ingreso</legend>
                <div class="fecha-grupo">
                    <div>
                        <label for="diaIngreso">Día</label>
                        <select id="diaIngreso" th:field="*{diaIngreso}" required aria-required="true"
                                th:classappend="${campoError == 'fechaIngreso'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaIngreso' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option th:each="d : ${#numbers.sequence(1, 31)}" th:value="${d}" th:text="${d}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="mesIngreso">Mes</label>
                        <select id="mesIngreso" th:field="*{mesIngreso}" required aria-required="true"
                                th:classappend="${campoError == 'fechaIngreso'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaIngreso' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option value="1">Enero</option>
                            <option value="2">Febrero</option>
                            <option value="3">Marzo</option>
                            <option value="4">Abril</option>
                            <option value="5">Mayo</option>
                            <option value="6">Junio</option>
                            <option value="7">Julio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Septiembre</option>
                            <option value="10">Octubre</option>
                            <option value="11">Noviembre</option>
                            <option value="12">Diciembre</option>
                        </select>
                    </div>
                    <div>
                        <label for="anioIngreso">Año</label>
                        <select id="anioIngreso" th:field="*{anioIngreso}" required aria-required="true"
                                th:classappend="${campoError == 'fechaIngreso'} ? 'error-campo'"
                                th:attr="aria-invalid=${campoError == 'fechaIngreso' ? 'true' : 'false'}">
                            <option value="">--</option>
                            <option th:each="a : ${#numbers.sequence(1900, 2099)}" th:value="${a}" th:text="${a}"></option>
                        </select>
                    </div>
                </div>
                <p class="ayuda" id="ayuda-ingreso">La fecha de ingreso no puede ser futura.</p>
            </fieldset>

            <div class="form-group">
                <label for="idUnidadAsignada">Unidad de venta asignada</label>
                <select id="idUnidadAsignada" th:field="*{idUnidadAsignada}" required aria-required="true"
                        th:classappend="${campoError == 'idUnidadAsignada'} ? 'error-campo'"
                        th:attr="aria-invalid=${campoError == 'idUnidadAsignada' ? 'true' : 'false'}">
                    <option value="">-- Seleccione una unidad --</option>
                    <option th:each="u : ${unidades}" th:value="${u.idUnidadDeVenta}" th:text="${u.nombreComercial}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipoEmpleado">Tipo de empleado</label>
                <select id="tipoEmpleado" th:field="*{tipoEmpleado}" required aria-required="true"
                        th:classappend="${campoError == 'tipoEmpleado'} ? 'error-campo'"
                        th:attr="aria-invalid=${campoError == 'tipoEmpleado' ? 'true' : 'false'}">
                    <option value="">-- Seleccione el tipo --</option>
                    <option value="CAJERO">Cajero</option>
                    <option value="COCINERO">Cocinero</option>
                </select>
            </div>

            <div id="bloqueCajero" class="form-group" style="display:none;" role="region" aria-label="Datos de cajero">
                <label for="turno">Turno del cajero</label>
                <select id="turno" th:field="*{turno}"
                        th:classappend="${campoError == 'turno'} ? 'error-campo'"
                        th:attr="aria-invalid=${campoError == 'turno' ? 'true' : 'false'}">
                    <option value="">-- Seleccione el turno --</option>
                    <option value="MANIANA">Mañana</option>
                    <option value="NOCHE">Noche</option>
                </select>
            </div>

            <div id="bloqueCocinero" class="form-group" style="display:none;" role="region" aria-label="Datos de cocinero">
                <label for="rolCocina">Categoría de cocina</label>
                <select id="rolCocina" th:field="*{rolCocina}"
                        th:classappend="${campoError == 'rolCocina'} ? 'error-campo'"
                        th:attr="aria-invalid=${campoError == 'rolCocina' ? 'true' : 'false'}">
                    <option value="">-- Seleccione la categoría --</option>
                    <option value="COCINERO">Cocinero</option>
                    <option value="COCINERO_AYUDANTE">Cocinero ayudante</option>
                    <option value="LAVAPLATOS">Lavaplatos</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Dar de alta al empleado</button>
            <a th:href="@{/home}" class="btn-volver" aria-label="Volver al panel de control">Volver al Panel</a>
        </form>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (currentTheme === 'dark' ? 'oscuro' : 'claro'));

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = (theme === 'dark') ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (newTheme === 'dark' ? 'oscuro' : 'claro'));
        });

        const tipoSelect = document.getElementById('tipoEmpleado');
        const bloqueCajero = document.getElementById('bloqueCajero');
        const bloqueCocinero = document.getElementById('bloqueCocinero');

        function actualizarBloques() {
            const valor = tipoSelect.value;
            bloqueCajero.style.display = (valor === 'CAJERO') ? 'block' : 'none';
            bloqueCocinero.style.display = (valor === 'COCINERO') ? 'block' : 'none';
        }

        tipoSelect.addEventListener('change', actualizarBloques);
        actualizarBloques();
    </script>
</body>
</html>
