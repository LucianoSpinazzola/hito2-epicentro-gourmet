<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Recibo de Haberes</title>
    <style>
        :root {
            --bg-principal: #f4f6f9;
            --bg-tarjeta: #ffffff;
            --texto-principal: #333333;
            --texto-secundario: #666666;
            --borde: #cccccc;
            --primario: #007bff;
            --primario-hover: #0056b3;
            --exito: #28a745;
            --exito-hover: #218838;
        }

        [data-theme="dark"] {
            --bg-principal: #121212;
            --bg-tarjeta: #1e1e1e;
            --texto-principal: #e0e0e0;
            --texto-secundario: #a0a0a0;
            --borde: #444444;
            --primario: #3792ff;
            --primario-hover: #1e70d6;
            --exito: #2ea44f;
            --exito-hover: #227d3c;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .recibo-container {
            background-color: var(--bg-tarjeta);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 550px;
        }

        .header-recibo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primario);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Lista de definiciones para los datos del empleado: NVDA la recorre como
           "lista de definiciones" y anuncia término y definición de cada par. */
        dl.info-list {
            margin: 0 0 20px 0;
        }

        dt.info-label {
            font-weight: bold;
            color: var(--primario);
            margin-top: 12px;
        }

        dd.info-value {
            margin: 0 0 4px 0;
            font-size: 15px;
        }

        .monto-panel {
            background-color: var(--bg-principal);
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            border: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-pdf {
            display: block;
            text-align: center;
            width: 100%;
            padding: 12px;
            background-color: var(--exito);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            box-sizing: border-box;
        }

        .btn-pdf:hover {
            background-color: var(--exito-hover);
        }

        .btn-volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--texto-principal);
            text-decoration: none;
            font-size: 14px;
        }

        /* Foco visible para navegación por teclado en botones y enlaces */
        .btn-pdf:focus-visible,
        .btn-volver:focus-visible,
        #theme-toggle:focus-visible {
            outline: 3px solid var(--primario);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- main: región principal. NVDA la anuncia como "región principal". -->
    <main class="recibo-container" role="main" aria-labelledby="recibo-title">

        <header class="header-recibo">
            <!-- h1 único: NVDA lo anuncia como "encabezado nivel 1". -->
            <h1 id="recibo-title" th:text="${titulo}">Recibo de Haberes</h1>
            <!-- Botón de tema con aria-label actualizado por el script al cambiar. -->
            <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 18px;"
                    aria-label="Cambiar entre modo claro y modo oscuro">
                <span aria-hidden="true">🌓</span> Modo
            </button>
        </header>

        <!-- Datos del empleado como lista de definiciones.
             NVDA anuncia "lista de definiciones" y lee término y definición de cada par. -->
        <dl class="info-list">
            <dt class="info-label">ID Empleado</dt>
            <dd class="info-value" th:text="${empleado.idEmpleado}">0</dd>

            <dt class="info-label">Usuario</dt>
            <dd class="info-value" th:text="${#authentication.name}">Usuario</dd>

            <dt class="info-label">Rol del Puesto</dt>
            <dd class="info-value" th:text="${rolUsuario}">Rol</dd>
        </dl>

        <!-- Panel del sueldo neto. aria-live="polite" hace que NVDA anuncie el monto
             cuando la vista termina de renderizar. -->
        <div class="monto-panel" role="status" aria-live="polite">
            <span>SUELDO NETO A COBRAR:</span>
            <span style="color: var(--exito);" th:text="'$' + ${#numbers.formatDecimal(sueldoCalculado, 1, 2)}">$0.00</span>
        </div>

        <!-- Enlace al PDF con aria-label explícito para que NVDA anuncie el destino. -->
        <a th:href="@{/empleados/descargar-sueldo}" class="btn-pdf"
           aria-label="Descargar recibo oficial de haberes en PDF">Descargar Recibo Oficial en PDF</a>

        <a th:href="@{/home}" class="btn-volver" aria-label="Volver al panel de control">Volver al Panel</a>

    </main>

    <!-- Script del modo oscuro con aria-label sincronizado, igual que en login e index. -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';

        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (currentTheme === 'dark' ? 'oscuro' : 'claro'));

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = (theme === 'dark') ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (newTheme === 'dark' ? 'oscuro' : 'claro'));
        });
    </script>
</body>
</html>
