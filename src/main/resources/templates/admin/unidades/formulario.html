<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar Unidad y Responsable</title>
	<style>
		:root {
			--bg-principal: #f4f6f9;
			--bg-tarjeta: #ffffff;
			--texto-principal: #333333;
			--texto-secundario: #666666;
			--borde: #cccccc;
			--primario: #007bff;
			--primario-hover: #0056b3;
			--danger: #dc3545;
		}

		[data-theme="dark"] {
			--bg-principal: #121212;
			--bg-tarjeta: #1e1e1e;
			--texto-principal: #e0e0e0;
			--texto-secundario: #a0a0a0;
			--borde: #444444;
			--primario: #3792ff;
			--primario-hover: #1e70d6;
			--danger: #ff6b7b;
		}

		body {
			font-family: Arial, sans-serif;
			background-color: var(--bg-principal);
			color: var(--texto-principal);
			padding: 20px;
			display: flex;
			justify-content: center;
			transition: background-color 0.3s, color 0.3s;
		}

		.form-container {
			background-color: var(--bg-tarjeta);
			padding: 30px;
			border-radius: 8px;
			width: 100%;
			max-width: 700px;
			border: 1px solid var(--borde);
		}

		.form-group {
			margin-bottom: 15px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			font-weight: bold;
		}

		input,
		select {
			width: 100%;
			padding: 10px;
			border: 1px solid var(--borde);
			border-radius: 4px;
			box-sizing: border-box;
			background-color: var(--bg-tarjeta);
			color: var(--texto-principal);
		}

		.btn {
			width: 100%;
			padding: 12px;
			background-color: var(--primario);
			color: white;
			border: none;
			border-radius: 4px;
			font-weight: bold;
			margin-top: 20px;
			cursor: pointer;
			font-size: 16px;
		}

		.btn:hover {
			background-color: var(--primario-hover);
		}

		.alert {
			background-color: #f8d7da;
			color: #721c24;
			padding: 10px;
			border-radius: 4px;
			margin-bottom: 15px;
		}

		[data-theme="dark"] .alert {
			background-color: #2c0b0e;
			color: #f8b4b9;
		}

		h1 {
			text-align: center;
		}

		h2 {
			border-bottom: 2px solid var(--primario);
			padding-bottom: 10px;
			color: var(--primario);
			margin-top: 30px;
		}

		.fila {
			display: flex;
			gap: 10px;
		}

		.fila>div {
			flex: 1;
		}

		.btn:focus-visible,
		input:focus-visible,
		select:focus-visible,
		#theme-toggle:focus-visible,
		a:focus-visible {
			outline: 3px solid var(--primario);
			outline-offset: 2px;
		}
	</style>
</head>

<body>
	<main class="form-container" role="main" aria-labelledby="titulo-unidad">
		<div style="display:flex; justify-content:space-between; align-items:center;">
			<h1 id="titulo-unidad">Registrar Unidad de Venta</h1>
			<button id="theme-toggle" style="background:none; border:none; cursor:pointer; font-size:18px;"
				aria-label="Cambiar entre modo claro y modo oscuro">
				<span aria-hidden="true">🌓</span> Modo
			</button>
		</div>

		<div th:if="${mensajeError}" class="alert" role="alert" th:text="${mensajeError}"></div>

		<form th:action="@{/admin/unidades/nuevo}" th:object="${registroForm}" method="post"
			aria-label="Formulario de registro de unidad y responsable">

			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

			<h2>1. Datos de la Unidad</h2>
			<div class="fila">
				<div class="form-group">
					<label for="nombreComercial">Nombre Comercial</label>
					<input type="text" id="nombreComercial" th:field="*{nombreComercial}" required
						aria-required="true" />
				</div>
				<div class="form-group">
					<label for="codigo">Código Único (10 caracteres)</label>
					<input type="text" id="codigo" th:field="*{codigo}" maxlength="10" required aria-required="true" />
				</div>
			</div>
			<div class="fila">
				<div class="form-group">
					<label for="superficie">Superficie (m²)</label>
					<input type="number" id="superficie" step="0.01" th:field="*{superficie}" required
						aria-required="true" />
				</div>
				<div class="form-group">
					<label for="idFestival">Festival Perteneciente</label>
					<select id="idFestival" th:field="*{idFestival}" required aria-required="true">
						<option value="" disabled selected>-- Seleccione --</option>
						<option th:each="f : ${festivales}" th:value="${f.idFestival}" th:text="${f.nombre}"></option>
					</select>
				</div>
			</div>

			<div class="form-group">
				<label for="tipoUnidad">Tipo de Unidad</label>
				<select id="tipoUnidad" th:field="*{tipoUnidad}" onchange="cambiarTipo()" required aria-required="true">
					<option value="FOOD_TRUCK">Food Truck</option>
					<option value="PUESTO_DESARMABLE">Puesto Desarmable</option>
				</select>
			</div>

			<div id="bloqueFT">
				<div class="fila">
					<div class="form-group">
						<label for="patente">Patente</label>
						<input type="text" id="patente" th:field="*{patente}" />
					</div>
					<div class="form-group" style="display:flex; align-items:center; margin-top:20px;">
						<input type="checkbox" id="requiereConexionElectrica" th:field="*{requiereConexionElectrica}"
							style="width:20px; margin-right:10px;" />
						<label for="requiereConexionElectrica" style="margin:0;">¿Requiere conexión eléctrica?</label>
					</div>
				</div>
			</div>

			<div id="bloquePD" style="display:none;">
				<div class="fila">
					<div class="form-group">
						<label for="cantidadCarpas">Cantidad de Carpas</label>
						<input type="number" id="cantidadCarpas" th:field="*{cantidadCarpas}" />
					</div>
					<div class="form-group">
						<label for="tiempoMontaje">Tiempo de Montaje (minutos)</label>
						<input type="number" id="tiempoMontaje" th:field="*{tiempoMontaje}" />
					</div>
				</div>
			</div>

			<h2>2. Datos del Responsable (Creará su Usuario)</h2>
			<div class="fila">
				<div class="form-group">
					<label for="nombreResponsable">Nombre</label>
					<input type="text" id="nombreResponsable" th:field="*{nombreResponsable}" required
						aria-required="true" />
				</div>
				<div class="form-group">
					<label for="apellidoResponsable">Apellido</label>
					<input type="text" id="apellidoResponsable" th:field="*{apellidoResponsable}" required
						aria-required="true" />
				</div>
				<div class="form-group">
					<label for="dniResponsable">DNI</label>
					<input type="number" id="dniResponsable" th:field="*{dniResponsable}" required
						aria-required="true" />
				</div>
			</div>
			<div class="fila">
				<div class="form-group">
					<label for="emailResponsable">Email (Será su Usuario)</label>
					<input type="email" id="emailResponsable" th:field="*{emailResponsable}" required
						aria-required="true" />
				</div>
				<div class="form-group">
					<label for="passwordResponsable">Contraseña</label>
					<input type="password" id="passwordResponsable" th:field="*{passwordResponsable}" required
						aria-required="true" />
				</div>
			</div>

			<button type="submit" class="btn">Registrar Unidad y Responsable</button>
		</form>
		<a th:href="@{/home}" style="display:block; text-align:center; margin-top:15px; color:var(--texto-secundario);"
			aria-label="Volver al panel de control">Volver al Panel</a>
	</main>

	<script>
		const themeToggle = document.getElementById('theme-toggle');
		const currentTheme = localStorage.getItem('theme') || 'light';
		document.documentElement.setAttribute('data-theme', currentTheme);
		themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (currentTheme === 'dark' ? 'oscuro' : 'claro'));

		themeToggle.addEventListener('click', () => {
			let theme = document.documentElement.getAttribute('data-theme');
			let newTheme = (theme === 'dark') ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', newTheme);
			localStorage.setItem('theme', newTheme);
			themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (newTheme === 'dark' ? 'oscuro' : 'claro'));
		});

		function cambiarTipo() {
			var tipo = document.getElementById("tipoUnidad").value;
			document.getElementById("bloqueFT").style.display = (tipo === "FOOD_TRUCK") ? "block" : "none";
			document.getElementById("bloquePD").style.display = (tipo === "PUESTO_DESARMABLE") ? "block" : "none";
		}
		cambiarTipo();
	</script>
</body>

</html>
