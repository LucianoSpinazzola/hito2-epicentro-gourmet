<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Epicentro Gourmet - Iniciar Sesión</title>
	<style>
		/* Variables de colores para el manejo de Modo Claro / Oscuro */
		:root {
			--bg-principal: #f4f6f9;
			--bg-tarjeta: #ffffff;
			--texto-principal: #333333;
			--texto-secundario: #666666;
			--borde: #cccccc;
			--primario: #007bff;
			--primario-hover: #0056b3;
			--error-bg: #f8d7da;
			--error-texto: #721c24;
			--logout-bg: #d4edda;
			--logout-texto: #155724;
		}

		[data-theme="dark"] {
			--bg-principal: #121212;
			--bg-tarjeta: #1e1e1e;
			--texto-principal: #e0e0e0;
			--texto-secundario: #a0a0a0;
			--borde: #444444;
			--primario: #3792ff;
			--primario-hover: #1e70d6;
			--error-bg: #2c0b0e;
			--error-texto: #f8b4b9;
			--logout-bg: #0f2d19;
			--logout-texto: #b4f8c6;
		}

		body {
			font-family: Arial, sans-serif;
			background-color: var(--bg-principal);
			color: var(--texto-principal);
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			transition: background-color 0.3s, color 0.3s;
		}

		.login-container {
			background-color: var(--bg-tarjeta);
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 400px;
			border: 1px solid var(--borde);
		}

		.header-login {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		h1 {
			font-size: 24px;
			margin: 0;
		}

		.btn-accesibilidad {
			background-color: var(--borde);
			color: var(--texto-principal);
			border: none;
			padding: 8px 12px;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
		}

		/* Foco visible para navegación por teclado: NVDA y JAWS anuncian el botón
           al recibir foco, y el outline permite verlo a quienes tienen baja visión. */
		.btn-accesibilidad:focus-visible,
		.btn-submit:focus-visible,
		input:focus-visible {
			outline: 3px solid var(--primario);
			outline-offset: 2px;
		}

		.form-group {
			margin-bottom: 15px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			font-weight: bold;
		}

		input {
			width: 100%;
			padding: 10px;
			border: 1px solid var(--borde);
			border-radius: 4px;
			background-color: var(--bg-tarjeta);
			color: var(--texto-principal);
			box-sizing: border-box;
		}

		input:focus {
			outline: 2px solid var(--primario);
		}

		.btn-submit {
			width: 100%;
			padding: 12px;
			background-color: var(--primario);
			color: white;
			border: none;
			border-radius: 4px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			margin-top: 10px;
		}

		.btn-submit:hover {
			background-color: var(--primario-hover);
		}

		.alert {
			padding: 12px;
			border-radius: 4px;
			margin-bottom: 15px;
			font-size: 14px;
		}

		.alert-danger {
			background-color: var(--error-bg);
			color: var(--error-texto);
		}

		.alert-success {
			background-color: var(--logout-bg);
			color: var(--logout-texto);
		}

		/* Elemento oculto visualmente pero disponible para lectores de pantalla */
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			border: 0;
		}
	</style>
</head>

<body>

	<!-- main indica la región principal del documento. NVDA anuncia "región principal"
         al entrar con la tecla de navegación por regiones (D en modo navegación). -->
	<main class="login-container" role="main">

		<header class="header-login">
			<!-- h1 único de la página: NVDA lo anuncia como "encabezado nivel 1". -->
			<h1>Iniciar Sesión</h1>
			<!-- Botón con aria-label: NVDA lee el aria-label en lugar del texto visible.
                 El emoji queda decorativo; si preferís, podés quitarlo sin perder accesibilidad. -->
			<button id="theme-toggle" class="btn-accesibilidad" aria-label="Cambiar entre modo claro y modo oscuro">
				🌓 Modo
			</button>
		</header>

		<!-- Mensajes con role="alert": NVDA y JAWS los anuncian automáticamente al aparecer,
             sin que el usuario tenga que moverse. El id permite asociarlos con aria-describedby. -->
		<div th:if="${mensajeError}" id="mensaje-error" class="alert alert-danger" role="alert"
			th:text="${mensajeError}"></div>
		<div th:if="${mensajeLogout}" id="mensaje-logout" class="alert alert-success" role="alert"
			th:text="${mensajeLogout}"></div>

		<!-- Formulario apuntando a /login con POST.
             th:action agrega automáticamente el token CSRF oculto cuando CSRF está activo.
             aria-describedby asocia el error al formulario: NVDA lo lee al entrar al formulario. -->
		<form th:action="@{/login}" method="post" aria-label="Formulario de ingreso al sistema"
			th:attr="aria-describedby=${mensajeError != null ? 'mensaje-error' : null}">

			<div class="form-group">
				<!-- label for vincula la etiqueta con el input. NVDA anuncia "Correo Electrónico, edición de texto, requerido". -->
				<label for="username">Correo Electrónico:</label>
				<input type="email" id="username" name="username" placeholder="ejemplo@epicentro.com" required
					aria-required="true" autocomplete="email">
			</div>

			<div class="form-group">
				<!-- Igual que el anterior, NVDA anuncia "Contraseña, edición de texto, requerido". -->
				<label for="password">Contraseña:</label>
				<input type="password" id="password" name="password" placeholder="Ingrese su clave" required
					aria-required="true" autocomplete="current-password">
			</div>

			<button type="submit" class="btn-submit">Ingresar al Sistema</button>
		</form>

	</main>

	<!-- Script del modo oscuro. No afecta accesibilidad: el tema se guarda en localStorage
         y el botón actualiza su aria-label para que NVDA anuncie el tema activo al activarlo. -->
	<script>
		const themeToggle = document.getElementById('theme-toggle');
		const currentTheme = localStorage.getItem('theme') || 'light';

		document.documentElement.setAttribute('data-theme', currentTheme);
		themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (currentTheme === 'dark' ? 'oscuro' : 'claro'));

		themeToggle.addEventListener('click', () => {
			let theme = document.documentElement.getAttribute('data-theme');
			let newTheme = (theme === 'dark') ? 'light' : 'dark';

			document.documentElement.setAttribute('data-theme', newTheme);
			localStorage.setItem('theme', newTheme);
			themeToggle.setAttribute('aria-label', 'Cambiar tema. Tema actual: ' + (newTheme === 'dark' ? 'oscuro' : 'claro'));
		});
	</script>
</body>

</html>
